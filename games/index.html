<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <meta name="theme-color" content="#05080f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --panel: rgba(12, 20, 34, 0.72);
      --line: rgba(0, 229, 255, 0.18);
      --accent: #00e5ff;
      --accent-rgb: 0, 229, 255;
      --violet: #8b5cf6;
      --amber: #ffb020;
      --text: #e6f1ff;
      --muted: #7d8ca3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      overflow-x: hidden;
    }
    #net { position: fixed; inset: 0; z-index: 0; }
    .grid {
      position: fixed; left: -50%; right: -50%; bottom: -10%; height: 60%;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(65deg); transform-origin: bottom;
      mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      animation: scroll 4s linear infinite; z-index: 0;
    }
    @keyframes scroll { to { background-position: 0 60px; } }
    .glow { position: fixed; width: 520px; height: 520px; border-radius: 50%; filter: blur(120px); opacity: .35; z-index: 0; }
    .glow.a { background: var(--accent); top: -180px; left: -160px; }
    .glow.b { background: var(--violet); bottom: -200px; right: -160px; }

    main {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 72px 16px 64px; text-align: center;
    }
    .back {
      position: fixed; top: 18px; left: 18px; z-index: 2;
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      color: var(--muted); text-decoration: none;
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); backdrop-filter: blur(10px);
      transition: color .2s, border-color .2s;
    }
    .back:hover { color: var(--accent); border-color: var(--accent); }

    .tag { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--accent);
      letter-spacing: .15em; text-transform: uppercase; margin-bottom: 14px; }
    .tag::before { content: "> "; opacity: .6; }
    h1 {
      font-size: clamp(36px, 8vw, 68px); font-weight: 700; line-height: 1.05;
      background: linear-gradient(90deg, #fff, var(--accent) 50%, var(--violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .status {
      margin-top: 28px;
      display: inline-flex; align-items: center; gap: 10px;
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      letter-spacing: .12em; text-transform: uppercase; color: var(--amber);
      padding: 9px 18px; border: 1px solid rgba(255,176,32,.4); border-radius: 999px;
      background: rgba(255,176,32,.08);
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
      box-shadow: 0 0 10px var(--amber); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }

    .menu {
      margin-top: 28px; width: 100%; max-width: 720px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    }
    @media (max-width: 640px) { .menu { grid-template-columns: repeat(2, 1fr); gap: 14px; } }

    .btn {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 26px 14px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      color: var(--text); text-decoration: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .btn::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(var(--accent-rgb), .18) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .6s;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover, .btn:focus-visible {
      transform: translateY(-5px); border-color: var(--accent); outline: none;
      box-shadow: 0 0 0 1px var(--accent), 0 12px 36px rgba(var(--accent-rgb), .22);
    }
    .btn svg { width: 36px; height: 36px; stroke: var(--accent); }
    .btn .label { font-size: 18px; font-weight: 700; }
    .btn .hint { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); }
    .btn.soon { cursor: default; }

    footer { position: relative; z-index: 1; text-align: center; padding-bottom: 18px;
      font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .grid, .status .dot { animation: none; } }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="grid"></div>

  <a class="back" href="../">&larr; home</a>

  <main>
    <p class="tag">module: games</p>
    <h1>Games</h1>

    <div class="status"><span class="dot"></span>Under development</div>

    <!-- To add a game: change href="#" to the game's link, and the label/hint text. Remove class "soon" when it's ready. -->
    <nav class="menu">
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="15.5" cy="12" r=".8"/><circle cx="18" cy="13.5" r=".8"/></svg>
        <span class="label">Game 01</span><span class="hint">coming soon</span>
      </a>
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>
        <span class="label">Game 02</span><span class="hint">coming soon</span>
      </a>
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="12" cy="12" r="1"/></svg>
        <span class="label">Game 03</span><span class="hint">coming soon</span>
      </a>
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 3 5 6 5 10a5 5 0 0 1-10 0c0-4 2-7 5-10z"/><path d="M9 21h6"/></svg>
        <span class="label">Game 04</span><span class="hint">coming soon</span>
      </a>
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span class="label">Game 05</span><span class="hint">coming soon</span>
      </a>
      <a class="btn soon" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-8 4 4 4-10 4 14z"/></svg>
        <span class="label">Game 06</span><span class="hint">coming soon</span>
      </a>
    </nav>
  </main>

  <footer>&copy; <span id="yr"></span> mohardiansyahofficial</footer>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();
    document.querySelectorAll(".btn.soon").forEach(b => b.addEventListener("click", e => e.preventDefault()));

    const c = document.getElementById("net"), ctx = c.getContext("2d");
    const rgb = getComputedStyle(document.documentElement).getPropertyValue("--accent-rgb").trim();
    let w, h, nodes = [];
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize() {
      w = c.width = innerWidth; h = c.height = innerHeight;
      const count = Math.min(90, Math.floor(w * h / 16000));
      nodes = Array.from({ length: count }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4 }));
    }
    const mouse = { x: -999, y: -999 };
    addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("resize", resize);
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const n of nodes) {
        if (!reduce) { n.x += n.vx; n.y += n.vy; }
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 130) { ctx.strokeStyle = `rgba(${rgb},${(1 - d / 130) * .25})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        }
        const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (md < 180) { ctx.strokeStyle = `rgba(139,92,246,${(1 - md / 180) * .5})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
        ctx.fillStyle = `rgba(${rgb},.7)`; ctx.beginPath(); ctx.arc(a.x, a.y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize(); draw();
  </script>
</body>
</html>
