<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohardiansyah</title>
  <meta name="description" content="Games and tools by Mohardiansyah.">
  <meta name="theme-color" content="#05080f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --panel: rgba(12, 20, 34, 0.72);
      --line: rgba(0, 229, 255, 0.18);
      --cyan: #00e5ff;
      --violet: #8b5cf6;
      --text: #e6f1ff;
      --muted: #7d8ca3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      overflow: hidden;
    }

    /* Animated network background */
    #net { position: fixed; inset: 0; z-index: 0; }

    /* Perspective grid floor */
    .grid {
      position: fixed; left: -50%; right: -50%; bottom: -10%; height: 60%;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(65deg);
      transform-origin: bottom;
      mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      animation: scroll 4s linear infinite;
      z-index: 0;
    }
    @keyframes scroll { to { background-position: 0 60px; } }

    /* Glow blobs */
    .glow {
      position: fixed; width: 520px; height: 520px; border-radius: 50%;
      filter: blur(120px); opacity: .35; z-index: 0;
    }
    .glow.a { background: var(--cyan); top: -180px; left: -160px; }
    .glow.b { background: var(--violet); bottom: -200px; right: -160px; }

    main {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
    }

    .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px; color: var(--cyan);
      letter-spacing: .15em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .tag::before { content: "> "; opacity: .6; }
    .cursor { display: inline-block; width: 8px; height: 1em; background: var(--cyan);
      vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      font-size: clamp(36px, 8vw, 76px);
      font-weight: 700; line-height: 1.05;
      background: linear-gradient(90deg, #fff, var(--cyan) 50%, var(--violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); margin-top: 14px; font-size: clamp(15px, 2.4vw, 18px); }

    .menu {
      margin-top: 48px;
      display: flex; gap: 22px; flex-wrap: wrap; justify-content: center;
    }
    .btn {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: 200px; padding: 28px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text); text-decoration: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: transform .25s, border-color .25s, box-shadow .25s;
      overflow: hidden;
    }
    .btn::after { /* scan line sweep */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(0,229,255,.18) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .6s;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover, .btn:focus-visible {
      transform: translateY(-6px);
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px var(--cyan), 0 12px 40px rgba(0,229,255,.25);
      outline: none;
    }
    .btn.tools:hover, .btn.tools:focus-visible {
      border-color: var(--violet);
      box-shadow: 0 0 0 1px var(--violet), 0 12px 40px rgba(139,92,246,.3);
    }
    .btn svg { width: 44px; height: 44px; stroke: var(--cyan); }
    .btn.tools svg { stroke: var(--violet); }
    .btn .label { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
    .btn .hint { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); }

    footer {
      position: fixed; bottom: 16px; left: 0; right: 0; z-index: 1;
      text-align: center; font-family: "JetBrains Mono", monospace;
      font-size: 12px; color: var(--muted);
    }
    footer a { color: var(--cyan); text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
      .grid, .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="grid"></div>

  <main>
    <p class="tag">system online<span class="cursor"></span></p>
    <h1>Welcome</h1>
    <p class="sub">Under development!</p>

    <nav class="menu">
      <a class="btn games" href="games/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="11" rx="5"/>
          <path d="M7 11v3M5.5 12.5h3"/>
          <circle cx="15.5" cy="12" r=".8"/><circle cx="18" cy="13.5" r=".8"/>
        </svg>
        <span class="label">Games</span>
        <span class="hint">./play</span>
      </a>
      <a class="btn tools" href="tools/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>
        </svg>
        <span class="label">Tools</span>
        <span class="hint">./build</span>
      </a>
    </nav>
  </main>

  <footer>&copy; <span id="yr"></span> mohardiansyahofficial &middot; <a href="https://github.com/mohardiansyahofficial">github</a></footer>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();

    // Floating connected-node network
    const c = document.getElementById("net"), ctx = c.getContext("2d");
    let w, h, nodes = [];
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function resize() {
      w = c.width = innerWidth; h = c.height = innerHeight;
      const count = Math.min(90, Math.floor(w * h / 16000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4
      }));
    }
    const mouse = { x: -999, y: -999 };
    addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("resize", resize);

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const n of nodes) {
        if (!reduce) { n.x += n.vx; n.y += n.vy; }
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 130) {
            ctx.strokeStyle = `rgba(0,229,255,${(1 - d / 130) * .25})`;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (md < 180) {
          ctx.strokeStyle = `rgba(139,92,246,${(1 - md / 180) * .5})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
        ctx.fillStyle = "rgba(0,229,255,.7)";
        ctx.beginPath(); ctx.arc(a.x, a.y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    resize(); draw();
  </script>
</body>
</html>
